<svg width="100%" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="200" fill="#0d1117"/>

  <!-- ground -->
  <line x1="0" y1="160" x2="800" y2="160" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- clouds -->
  <g fill="#30363d">
    <rect x="0" y="0" width="40" height="8" rx="4">
      <animate attributeName="x" from="900" to="-60" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="30" height="6" rx="3" y="25">
      <animate attributeName="x" from="500" to="-60" dur="9s" begin="-3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- score -->
  <text x="770" y="30" text-anchor="end" font-family="monospace" font-size="16" fill="#8b949e">HI 07420</text>

  <!-- dino -->
  <g transform="translate(60,110)" fill="#e6edf3">
    <animateTransform attributeName="transform" type="translate" values="60,110;60,107;60,110" keyTimes="0;0.5;1" dur="0.3s" additive="sum" repeatCount="indefinite"/>
    <rect x="0" y="10" width="30" height="20"/>
    <rect x="24" y="0" width="16" height="14"/>
    <rect x="34" y="4" width="3" height="3" fill="#0d1117"/>
    <rect x="-6" y="16" width="8" height="6"/>
    <g>
      <rect x="4" y="30" width="6" height="10"/>
      <rect x="18" y="30" width="6" height="5"/>
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.3s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="4" y="30" width="6" height="5"/>
      <rect x="18" y="30" width="6" height="10"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.3s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- cacti -->
  <g fill="#3fb950">
    <g>
      <rect x="0" y="120" width="8" height="40"/>
      <rect x="-6" y="128" width="8" height="6"/>
      <rect x="10" y="134" width="8" height="6"/>
      <animateTransform attributeName="transform" type="translate" from="800,0" to="-40,0" dur="3s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="0" y="126" width="6" height="34"/>
      <animateTransform attributeName="transform" type="translate" from="1100,0" to="-40,0" dur="3s" begin="-1.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="0" y="130" width="6" height="30"/>
      <rect x="8" y="136" width="6" height="6"/>
      <animateTransform attributeName="transform" type="translate" from="1400,0" to="-40,0" dur="3s" begin="-2.4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
